name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 03:00 in Brazil
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2563EB&color_dots=#EBEDF0,#A7F3D0,#34D399,#10B981,#047857
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0F1B2D,#064E3B,#047857,#10B981,#34D399

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
