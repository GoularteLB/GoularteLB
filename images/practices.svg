    <circle cx="397" cy="19.0" r="3" fill="#22D3EE"/>
    <text x="407" y="24.0">MVVM</text>
  </g>
  <g class="r" style="animation-delay:0.40s">
    <rect x="467" y="1" width="85" height="36" rx="18" fill="#0A1628" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="483" cy="19.0" r="3" fill="#60A5FA"/>
    <text x="493" y="24.0">Scrum</text>
