<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="01 About">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track"><rect x="170" y="30" width="730" height="6"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .grow{transform-box:fill-box;transform-origin:left;animation:grow 1.1s .25s cubic-bezier(.6,0,.2,1) both}
    .run{animation:run 4.5s 1.4s ease-in-out infinite}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes run{0%{transform:translateX(-160px)}55%,100%{transform:translateX(890px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.anim{display:none}}
  </style>
  <g class="rise">
    <text class="mono" x="2" y="42" font-size="15" font-weight="600" fill="#34D399">01</text>
    <text class="mono" x="30" y="42" font-size="15" fill="#64748B">/</text>
    <text class="sans" x="52" y="43" font-size="28" font-weight="700" letter-spacing="-.5" fill="#F8FAFC">About</text>
  </g>
  <rect class="grow" x="170" y="32.5" width="730" height="1.5" fill="#1E293B"/>
  <rect class="grow" x="170" y="32" width="48" height="2.5" rx="1" fill="url(#g)"/>
  <g clip-path="url(#track)"><rect class="run anim" x="170" y="32" width="160" height="2.5" fill="url(#run)"/></g>
</svg>
