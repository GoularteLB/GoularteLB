    </g>
    <text class="sans" x="940" y="230" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">Domain</text>
    <text class="mono" x="940" y="248" font-size="10.5" fill="#34D399" text-anchor="middle" letter-spacing="1">DDD · TDD</text>
    <text class="mono" x="940" y="152" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="2">PORTS</text>
  </g>
