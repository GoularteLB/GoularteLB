        <animate attributeName="opacity" dur="2.7s" begin="2.50s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.52;.6;1"/>
      </circle>
      <circle class="anim" r="4.5" fill="#34D399" opacity="0">
        <animateMotion dur="2.7s" begin="2.95s" repeatCount="indefinite" path="M940 375 L940 282" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="2.7s" begin="2.95s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.52;.6;1"/>
      </circle>
      <circle class="anim" r="4.5" fill="#34D399" opacity="0">
        <animateMotion dur="2.7s" begin="3.40s" repeatCount="indefinite" path="M812.7 301.5 L893.2 255" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="2.7s" begin="3.40s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.52;.6;1"/>
      </circle>
      <circle class="anim" r="4.5" fill="#34D399" opacity="0">
        <animateMotion dur="2.7s" begin="3.85s" repeatCount="indefinite" path="M812.7 154.5 L893.2 201" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="2.7s" begin="3.85s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.52;.6;1"/>
      </circle>
