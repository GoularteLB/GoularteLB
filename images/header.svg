<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Lucas Goularte, Software Engineer (Java and C#), with an animated hexagonal architecture diagram">
  <defs>
    <radialGradient id="glow" cx="940" cy="228" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="160" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity=".07"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chain" gradientUnits="userSpaceOnUse" x1="842" y1="130" x2="1038" y2="326">
      <stop offset="0" stop-color="#4ADE80"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A3A"/><stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A5F3FC" stop-opacity=".95"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1000 0;1000 0" keyTimes="0;.45;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".8"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#14213A"/></pattern>
    <clipPath id="frame"><rect width="1200" height="460" rx="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
    .hex{transform-origin:940px 228px;animation:hex 1.1s .2s cubic-bezier(.2,.8,.2,1) both}
    .flow{animation:flow 1.6s linear infinite}
    .line{clip-path:inset(0 100% 0 0);animation:type 12s steps(32) infinite}
    .l2{animation-delay:4s}.l3{animation-delay:8s}
    .caret{animation:blink 1s steps(1) infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    .beat{transform-box:fill-box;transform-origin:center;animation:beat 2.7s 1.6s ease-in-out infinite}
    .sweep{animation:sweep 7s 1.6s ease-in-out infinite}
    @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    @keyframes hex{from{opacity:0;transform:scale(.6) rotate(-30deg)}to{opacity:1;transform:none}}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @keyframes type{0%{clip-path:inset(0 100% 0 0)}11%,28%{clip-path:inset(0 0 0 0)}33%,100%{clip-path:inset(0 100% 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes sweep{0%{transform:translateX(-400px)}45%,100%{transform:translateX(1500px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{clip-path:none}.l2,.l3,.anim{display:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#050B1A"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
    <rect width="1200" height="460" fill="url(#glow)"/>
    <rect width="1200" height="460" fill="url(#glow2)"/>
    <rect class="sweep" x="0" y="0" width="320" height="2" fill="url(#edge)"/>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#132033" stroke-width="2"/>
  <!-- left: identity -->
  <g class="rise mono" style="animation-delay:.1s" font-size="18">
    <text x="80" y="98"><tspan fill="#34D399">~/lucas</tspan><tspan fill="#64748B"> on </tspan><tspan fill="#60A5FA">main</tspan><tspan fill="#64748B"> › </tspan><tspan fill="#CBD5E1">./hello --lang=en,pt</tspan></text>
  </g>
  <g class="rise sans" style="animation-delay:.25s" font-size="74" font-weight="700" letter-spacing="-2">
    <text x="76" y="176" fill="#F8FAFC">Lucas Goularte</text>
    <text x="76" y="176" fill="url(#shine)">Lucas Goularte</text>
  </g>
  <g class="mono" font-size="26" font-weight="500" fill="#CBD5E1">
    <text class="line l1" x="80" y="230"><tspan fill="#34D399">›</tspan> Software Engineer · Java &amp; C#<tspan class="caret" fill="#34D399">▍</tspan></text>
    <text class="line l2" x="80" y="230"><tspan fill="#22D3EE">›</tspan> Domain-Driven, Test-Driven<tspan class="caret" fill="#22D3EE">▍</tspan></text>
    <text class="line l3" x="80" y="230"><tspan fill="#60A5FA">›</tspan> From backend to mobile, end to end<tspan class="caret" fill="#60A5FA">▍</tspan></text>
  </g>
  <g class="rise sans" style="animation-delay:.45s">
    <text x="80" y="278" font-size="18" fill="#94A3B8">I model the domain, prove it with tests, and ship it to production.</text>
  </g>
  <g class="rise" style="animation-delay:.6s">
    <g><rect x="80" y="312" width="61" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="92" y="333.4" font-size="15" fill="#94A3B8">Java</text></g>
    <g><rect x="149" y="312" width="42" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="161" y="333.4" font-size="15" fill="#94A3B8">C#</text></g>
    <g><rect x="199" y="312" width="61" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="211" y="333.4" font-size="15" fill="#94A3B8">.NET</text></g>
    <g><rect x="268" y="312" width="79" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="280" y="333.4" font-size="15" fill="#94A3B8">Spring</text></g>
    <g><rect x="355" y="312" width="70" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="367" y="333.4" font-size="15" fill="#94A3B8">React</text></g>
    <g><rect x="433" y="312" width="51" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="445" y="333.4" font-size="15" fill="#94A3B8">Vue</text></g>
    <g><rect x="492" y="312" width="88" height="32" rx="16" fill="#0A1628" stroke="#1E293B"/><text class="mono" x="504" y="333.4" font-size="15" fill="#94A3B8">Flutter</text></g>
  </g>
  <g class="rise sans" style="animation-delay:.9s">
    <circle class="ring" cx="88" cy="392" r="5" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="88" cy="392" r="5" fill="#34D399"/>
    <text x="104" y="398" font-size="17"><tspan fill="#CBD5E1" font-weight="600">Available for freelance</tspan><tspan fill="#64748B">  ·  remote  ·  Brazil (UTC−3)</tspan></text>
  </g>
  <!-- right: hexagonal architecture, live -->
  <g class="hex">
    <polygon points="940,63 1082.9,145.5 1082.9,310.5 940,393 797.1,310.5 797.1,145.5" fill="none" stroke="#1B2B44" stroke-width="1.5"/>
    <polygon class="flow" points="940,63 1082.9,145.5 1082.9,310.5 940,393 797.1,310.5 797.1,145.5" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 12"/>
    <polygon points="940,130 1024.9,179 1024.9,277 940,326 855.1,277 855.1,179" fill="#0A1628" fill-opacity=".75" stroke="url(#chain)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="940" y1="63" x2="940" y2="176" stroke="#16243A" stroke-width="1.5" stroke-dasharray="3 6"/>
      <line x1="1082.9" y1="145.5" x2="985" y2="202" stroke="#16243A" stroke-width="1.5" stroke-dasharray="3 6"/>
      <line x1="1082.9" y1="310.5" x2="985" y2="254" stroke="#16243A" stroke-width="1.5" stroke-dasharray="3 6"/>
      <line x1="940" y1="393" x2="940" y2="280" stroke="#16243A" stroke-width="1.5" stroke-dasharray="3 6"/>
      <line x1="797.1" y1="310.5" x2="895" y2="254" stroke="#16243A" stroke-width="1.5" stroke-dasharray="3 6"/>
      <line x1="797.1" y1="145.5" x2="895" y2="202" stroke="#16243A" stroke-width="1.5" stroke-dasharray="3 6"/>
    <circle cx="940" cy="228" r="62" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0 940 228" to="360 940 228" dur="24s" repeatCount="indefinite"/>
    </circle>
    <g class="beat">
