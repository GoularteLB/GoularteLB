        <animateMotion dur="2.7s" begin="1.60s" repeatCount="indefinite" path="M940 174 L940 81" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="2.7s" begin="1.60s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.52;.6;1"/>
      </circle>
