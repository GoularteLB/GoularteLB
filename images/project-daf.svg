<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" role="img" aria-label="DAF: monitoring truck status and emission-control equipment. Client work.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="halo" cx="440" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE" stop-opacity=".12"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="438" height="278" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .bar{stroke-dasharray:376;animation:bar 1.2s .3s cubic-bezier(.6,0,.2,1) both}
    @keyframes bar{from{stroke-dashoffset:376}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.anim{display:none}}
  </style>
  <rect x="1" y="1" width="438" height="278" rx="18" fill="#0A1628" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="438" height="278" rx="18" fill="url(#halo)" clip-path="url(#clip)"/>
  <line class="bar" x1="32" y1="1.5" x2="408" y2="1.5" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <g class="rise">
    <text class="mono" x="32" y="41" font-size="12" letter-spacing="1.6" fill="#64748B"><tspan fill="#22D3EE" font-weight="700">02</tspan>  FLEET · TELEMETRY</text>
    <rect x="279" y="24" width="129" height="24" rx="12" fill="none" stroke="#1E293B"/><text class="mono" x="343.5" y="40" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing=".5">CLIENT · PRIVATE</text>
    <text class="sans" x="32" y="86" font-size="26" font-weight="700" letter-spacing="-.5" fill="#F8FAFC">DAF</text>
    <text class="sans" x="32" y="114" font-size="15" fill="#94A3B8">Live status of trucks and their</text>
    <text class="sans" x="32" y="135" font-size="15" fill="#94A3B8">emission-control equipment.</text>
  </g>
  <g transform="translate(32 158)">
    <path d="M0 44 C 60 6, 120 54, 188 28 S 316 4, 376 26" fill="none" stroke="#16263D" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 44 C 60 6, 120 54, 188 28 S 316 4, 376 26" fill="none" stroke="#2A3B55" stroke-width="1.5" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="44" r="5" fill="#0A1628" stroke="#22D3EE" stroke-width="2"/>
    <circle class="anim" cx="0" cy="44" r="5" fill="none" stroke="#22D3EE" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="2.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="188" cy="28" r="5" fill="#0A1628" stroke="#FBBF24" stroke-width="2"/>
    <circle class="anim" cx="188" cy="28" r="5" fill="none" stroke="#FBBF24" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="376" cy="26" r="5" fill="#0A1628" stroke="#22D3EE" stroke-width="2"/>
    <circle class="anim" cx="376" cy="26" r="5" fill="none" stroke="#22D3EE" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <g>
      <rect x="-9" y="-5" width="18" height="10" rx="3" fill="#22D3EE"/>
      <rect x="4" y="-4" width="5" height="8" rx="1.5" fill="#F8FAFC" opacity=".85"/>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" path="M0 44 C 60 6, 120 54, 188 28 S 316 4, 376 26" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear"/>
    </g>
    <text class="mono" x="188" y="10" font-size="9.5" fill="#FBBF24" text-anchor="middle">SCR check</text>
  </g>
  <g class="rise" style="animation-delay:.35s">
    <g><rect x="32" y="232" width="73" height="24" rx="12" fill="#0A1628" stroke="#1E293B"/><circle cx="47" cy="244" r="3" fill="#22D3EE"/><text class="mono" x="58" y="248.14" font-size="11.5" fill="#CBD5E1">Fleet</text></g>
    <g><rect x="113" y="232" width="101" height="24" rx="12" fill="#0A1628" stroke="#1E293B"/><circle cx="128" cy="244" r="3" fill="#22D3EE"/><text class="mono" x="139" y="248.14" font-size="11.5" fill="#CBD5E1">Telemetry</text></g>
    <g><rect x="222" y="232" width="115" height="24" rx="12" fill="#0A1628" stroke="#1E293B"/><circle cx="237" cy="244" r="3" fill="#22D3EE"/><text class="mono" x="248" y="248.14" font-size="11.5" fill="#CBD5E1">Diagnostics</text></g>
  </g>
</svg>
