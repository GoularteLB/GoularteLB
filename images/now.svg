    <text class="in" style="animation-delay:2.39s" x="32" y="185"><tspan fill="#FBBF24">c09e8f4</tspan>  <tspan fill="#22D3EE">feat(bpm):</tspan> <tspan fill="#CBD5E1">process orchestration with Camunda 8 · BPMN + DMN</tspan></text>
