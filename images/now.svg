    <text class="in" style="animation-delay:1.75s" x="32" y="123"><tspan fill="#FBBF24">a3f9c21</tspan>  <tspan fill="#A78BFA">feat(artif):</tspan> <tspan fill="#CBD5E1">humanized AI assistant for orthodontic clinics</tspan></text>
