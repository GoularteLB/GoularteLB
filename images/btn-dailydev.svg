<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 44" width="145" height="44" role="img" aria-label="daily.dev">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity=".7"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="143" height="42" rx="21"/></clipPath>
  </defs>
  <style>
    .s{animation:s 5s 2.0s ease-in-out infinite}
    .p{transform-box:fill-box;transform-origin:center;animation:p 2.4s 2.0s ease-out infinite}
    @keyframes s{0%{transform:translateX(-60px)}35%,100%{transform:translateX(165px)}}
    @keyframes p{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
    @media (prefers-reduced-motion:reduce){.s,.p{display:none}}
  </style>
  <rect x="1" y="1" width="143" height="42" rx="21" fill="#0A1628" stroke="url(#b)" stroke-width="1.5"/>
  <g clip-path="url(#c)"><rect class="s" x="0" y="0" width="50" height="44" fill="url(#s)"/></g>
  <circle class="p" cx="24" cy="22" r="4" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="24" cy="22" r="4" fill="#34D399"/>
  <text x="38" y="27.5" font-family="'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">daily.dev</text>
</svg>
